version: '3.8'

services:
  pd-manager:
    build:
      context: .
      dockerfile: scripts/fpk/Dockerfile
    image: pd-manager:latest
    container_name: pd-manager
    ports:
      - "5000:5000"
    volumes:
      # 持久化 SQLite 数据
      - ./data:/app/data
    environment:
      - COZE_PROJECT_ENV=PROD
      - PORT=5000
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
